# Nginx reverse proxy for the Learning Platform (M6 deployment)
#
# Runs on the host (systemd), NOT in Docker compose — so it can terminate TLS
# with certbot-managed certs and apply HSTS before traffic reaches the app.
#
# v1 (ADR-0007): single VPS, one dedicated deployment, C8 (one code artifact,
# different configuration). This config is customer-agnostic — instance identity
# (domain, branding) comes from environment / cert paths, not hardcoded.
#
# Install: see docs/07-deployment/DEPLOYMENT_GUIDE.md
#   sudo cp docs/07-deployment/nginx.conf /etc/nginx/sites-available/learning-platform
#   sudo ln -s /etc/nginx/sites-available/learning-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# --- Upstream: the Next.js app (docker compose, port 3000 on localhost) ---
upstream lp_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- Rate-limiting zone (per ADR-0013 / M4.2) ---
# 10 req/s per IP burst 20 — mirrors the in-app rate-limit.ts policy but at the
# edge so abusive clients are rejected before they reach Node.
limit_req_zone $binary_remote_addr zone=lp_api:10m rate=10r/s;

# --- Redirect HTTP -> HTTPS (HSTS prerequisite) ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge passthrough (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS (managed by certbot; paths are instance configuration, not hardcoded)
    ssl_certificate     /etc/letsencrypt/live/learning/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learning/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (M4.2 follow-up — only valid over TLS, now live per ADR-0007/M6).
    # 1 year + subdomains + preload-list eligible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers (defense in depth; the app also sets these via next.config.mjs).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE (do NOT append) X-Forwarded-For with the real client IP.
    # $proxy_add_x_forwarded_for would keep a client-supplied XFF chain, so an
    # attacker could forge a fresh leftmost entry per request and reset their
    # in-app IP-keyed rate-limit bucket (login brute-force, session probing).
    # Setting $remote_addr alone discards any forged hop; `ipKey()` then sees
    # only the true client. See apps/web/src/lib/rate-limit.ts#ipKey.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Trust the request id propagated from upstream / LB (M5 correlation).
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header Connection "";

    # --- Internal-only: metrics scrape (M5) ---
    # Allowed only from localhost (the scrape target runs on this host).
    # The /api/metrics route ALSO gates on a bearer token; this is a second
    # layer so the endpoint is never exposed even if the token leaks.
    location /api/metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=lp_api burst=5 nodelay;
        proxy_pass http://lp_app;
    }

    # --- Health / readiness (LB & probes; no auth, low rate) ---
    location /api/health {
        access_log off;
        proxy_pass http://lp_app;
    }
    location /api/ready {
        access_log off;
        proxy_pass http://lp_app;
    }

    # --- security.txt (public per RFC 9116) ---
    location /.well-known/security.txt {
        proxy_pass http://lp_app;
    }

    # --- ACME renewal passthrough over HTTPS (rare) ---
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # --- API rate-limited ---
    location /api/ {
        limit_req zone=lp_api burst=20 nodelay;
        proxy_pass http://lp_app;
    }

    # --- Everything else (pages, static, auth) ---
    location / {
        proxy_pass http://lp_app;
    }

    # Body size limit (defensive; v1 has no large uploads until media storage lands)
    client_max_body_size 2m;
}
