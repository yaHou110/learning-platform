#!/usr/bin/env bash
#
# Learning Platform — deploy workflow (M6).
#
# GitHub Actions: builds the Docker image, pushes to GHCR, SSHes to the
# production host, pulls the new image via docker compose, runs the stack,
# and smoke-tests /api/health + /api/ready + /api/metrics.
# On failure: rolls back to the previous image.
#
# Required repository secrets:
#   PROD_HOST        — production VPS IP or hostname
#   PROD_USER        — SSH user (e.g., deploy)
#   PROD_SSH_KEY     — private key (base64-encoded)
#   PROD_ENV         — path to env file on host (e.g., /etc/learning-platform/env)
#   GHCR_TOKEN       — PAT with write:packages scope (or use GITHUB_TOKEN)
#
# Triggers: push to main (after governance + verify pass).

name: Deploy to Production (legacy VPS lane)

# ADR-0018: production is Vercel + Railway (see deploy-vercel.yml). This
# workflow is the legacy self-hosted VPS lane (ADR-0007) and is kept as a
# MANUAL workflow only — it requires PROD_HOST/PROD_USER/PROD_SSH_KEY/
# GHCR_TOKEN secrets that are not configured, so triggering it on every push
# to main failed CI runs (red X on every commit).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'VPS environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          # Explicit build target: the Dockerfile has TWO final stages —
          # `runner` (the slim Next.js standalone image that serves traffic) at
          # Stage 2 and `migrate` (a one-shot Drizzle migration image) at Stage 3.
          # Stage 3 is LAST, so without an explicit `target`, buildx defaults to
          # building `migrate` and pushes THAT to GHCR as `:latest` — an image
          # with no server.js, so `docker compose pull` lands a non-serving image
          # and the app crash-loops with `Cannot find module '.../server.js'`
          # (confirmed locally 2026-07-22; the prod image fetched before this fix
          # was the migrate target, not runner). Pin `runner` so GHCR always
          # holds the serving image. The `migrate` compose service builds its own
          # local image via its own `target: migrate`, so this pin does not affect it.
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy via SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${PROD_USER}@${PROD_HOST}" <<'REMOTE_EOF'
          set -euo pipefail
          cd /opt/learning-platform

          # 1. Capture the currently-running app image so rollback can return to
          #    it. `:latest` is a moving tag; without this, a failed deploy's
          #    rollback would just recreate the same bad image. lp-app is the
          #    compose container name for the web service. Empty on first deploy.
          #    (Gordon Docker review 2026-07-25 — Finding #3 fix.)
          PREV_IMAGE=$(docker inspect lp-app \
            --format '{{index .Config.Image}}' 2>/dev/null || true)
          echo "$PREV_IMAGE" > /opt/learning-platform/.last-good-image
          echo "Captured previous image for rollback: ${PREV_IMAGE:-<none>}"

          # 2. Pull the EXACT SHA tag this workflow built — not the moving :latest.
          #    metadata-action emits `type=sha,prefix=`, so $IMAGE resolves to
          #    ghcr.io/.../web:<git-sha>. Pulling the SHA (not `:latest`) means a
          #    failed deploy's rollback can recreate against the *previous* SHA
          #    recorded in step 1, instead of re-running whatever :latest points at.
          echo "Pulling new image: $IMAGE"
          docker pull "$IMAGE"

          # 3. Override the compose image to the resolved SHA tag so `up` runs
          #    THIS build, not whatever :latest currently points at.
          echo "Starting new containers with image: $IMAGE"
          WEB_IMAGE="$IMAGE" docker compose -f docker-compose.prod.yml \
            up -d --remove-orphans

          # 4. Wait for ALL services to report healthy — not just one.
          #    The old `grep -q "healthy"` matched if ANY single service (e.g.
          #    postgres) was healthy while app was still crash-looping, breaking
          #    the loop early and proceeding to smoke tests prematurely.
          #    Count healthy services against the configured service total.
          #    (Gordon Docker review 2026-07-25 — Finding #2 fix.)
          EXPECTED=$(docker compose -f docker-compose.prod.yml config --services | wc -l)
          HEALTHY=0
          for i in {1..30}; do
            HEALTHY=$(docker compose -f docker-compose.prod.yml ps --format json \
              | jq -s '[.[] | select(.Health=="healthy")] | length' 2>/dev/null || echo 0)
            if [ "$HEALTHY" -ge "$EXPECTED" ]; then
              echo "All $EXPECTED services healthy"
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" -lt "$EXPECTED" ]; then
            echo "Timed out waiting for health ($HEALTHY/$EXPECTED healthy)" >&2
            exit 1
          fi

          # 5. Smoke test the three endpoints
          echo "Smoke testing /api/health..."
          curl -fsS --max-time 10 http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'

          echo "Smoke testing /api/ready..."
          curl -fsS --max-time 10 http://127.0.0.1:3000/api/ready | grep -q '"status":"ready"'

          echo "Smoke testing /api/metrics (with token)..."
          curl -fsS --max-time 10 \
            -H "Authorization: Bearer ${METRICS_TOKEN}" \
            http://127.0.0.1:3000/api/metrics | grep -q 'http_requests_total'

          echo "✅ All smoke tests passed"
          REMOTE_EOF

      - name: Rollback on failure
        if: failure()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          echo "⚠️ Deployment failed — rolling back to previous image"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${PROD_USER}@${PROD_HOST}" <<'REMOTE_EOF'
          set -euo pipefail
          cd /opt/learning-platform
          # Roll back to the image that was running BEFORE this deploy captured
          # it into .last-good-image. The old code did `--force-recreate` against
          # `:latest` — but `:latest` now points at the bad build we just pulled,
          # so that recreated the same broken image. Here we recreate with the
          # previous SHA tag instead. Empty marker (first-ever deploy) means we
          # cannot roll back — fail loudly rather than silently re-running bad.
          # (Gordon Docker review 2026-07-25 — Finding #3 fix.)
          PREV_IMAGE=$(cat /opt/learning-platform/.last-good-image 2>/dev/null || echo "")
          if [ -z "$PREV_IMAGE" ]; then
            echo "⚠️ No previous image recorded — cannot roll back. Leaving bad deploy in place for manual triage." >&2
            exit 1
          fi
          echo "⚠️ Rolling back from bad deploy to previous image: $PREV_IMAGE"
          WEB_IMAGE="$PREV_IMAGE" docker compose -f docker-compose.prod.yml \
            up -d --force-recreate --remove-orphans
          echo "Rolled back to: $PREV_IMAGE"
          REMOTE_EOF

  notify:
    name: Notify
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack/Email/Telegram placeholder
        run: |
          echo "Deployment ${{ job.status }} — see run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        if: always()