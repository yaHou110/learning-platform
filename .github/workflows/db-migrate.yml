name: Apply Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Database environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose connection
        working-directory: packages/core
        run: node scripts/db-diagnose.cjs

      - name: Apply migrations
        if: success()
        working-directory: packages/core
        run: pnpm db:migrate
