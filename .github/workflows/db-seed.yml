name: Seed Demo Data

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Database environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

jobs:
  seed:
    name: Migrate + seed demo data (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — reject masked secrets
        run: |
          if [[ "$DATABASE_URL" == *"***"* ]]; then
            echo "::error::DATABASE_URL contains masked value (***). The secret is likely a placeholder, not a real connection string."
            exit 1
          fi
          if [ ${#DATABASE_URL} -lt 40 ]; then
            echo "::error::DATABASE_URL is too short (${#DATABASE_URL} chars). Expected a full postgres://... connection string."
            exit 1
          fi
          echo "DATABASE_URL length: ${#DATABASE_URL} chars"
          echo "DATABASE_URL starts with: ${DATABASE_URL:0:20}..."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (idempotent)
        working-directory: packages/core
        run: pnpm db:migrate

      - name: Seed demo tenant + admin (idempotent)
        working-directory: packages/core
        run: pnpm db:seed:dev
