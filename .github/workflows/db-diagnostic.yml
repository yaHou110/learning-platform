name: DB Connection Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Railway PostgreSQL connectivity
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Test 1 — psql version
        run: |
          echo "=== TEST 1: psql --version ==="
          psql --version

      - name: Test 2 — psql connect
        run: |
          echo "=== TEST 2: psql connect to Railway ==="
          # Extract parts from DATABASE_URL
          DB_URL="$DATABASE_URL"
          echo "URL (masked): $(echo "$DB_URL" | sed 's/:[^:@]*@/:***@/')"
          PGPASSWORD=$(echo "$DB_URL" | sed -n 's|postgresql://[^:]*:\([^@]*\)@.*|\1|p')
          PGHOST=$(echo "$DB_URL" | sed -n 's|.*@\([^:]*\):.*|\1|p')
          PGPORT=$(echo "$DB_URL" | sed -n 's|.*:\([0-9]*\)/.*|\1|p')
          PGDATABASE=$(echo "$DB_URL" | sed -n 's|.*/\([^?]*\).*|\1|p')
          PGUSER=$(echo "$DB_URL" | sed -n 's|postgresql://\([^:]*\):.*|\1|p')
          echo "Host: $PGHOST"
          echo "Port: $PGPORT"
          echo "DB:   $PGDATABASE"
          echo "User: $PGUSER"
          echo "Pwd length: ${#PGPASSWORD}"
          echo "---"
          # Try plain TCP (no SSL)
          PGPASSWORD="$PGPASSWORD" psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -c "SELECT 1 AS test;" 2>&1 || true
          echo "---"
          # Try with sslmode=disable
          PGPASSWORD="$PGPASSWORD" psql "postgresql://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/$PGDATABASE?sslmode=disable" -c "SELECT 1 AS test;" 2>&1 || true
          echo "---"
          # Try with sslmode=require
          PGPASSWORD="$PGPASSWORD" psql "postgresql://$PGUSER:$PGASSWORD@$PGHOST:$PGPORT/$PGDATABASE?sslmode=require" -c "SELECT 1 AS test;" 2>&1 || true

      - name: Test 3 — openssl s_client (TLS probe)
        run: |
          echo "=== TEST 3: openssl s_client ==="
          echo "Q" | timeout 10 openssl s_client -connect tokaido.proxy.rlwy.net:45305 2>&1 || true

      - name: Test 4 — nc TCP probe
        run: |
          echo "=== TEST 4: nc -vz TCP probe ==="
          nc -vz tokaido.proxy.rlwy.net 45305 2>&1 || true

      - name: Test 5 — raw TCP dump (what does the port actually respond with?)
        run: |
          echo "=== TEST 5: raw TCP — what does Railway respond with? ==="
          # Send raw bytes and see what comes back
          printf '\x00\x00\x00\x08\x04\xd2\x16\x2f' | timeout 5 nc tokaido.proxy.rlwy.net 45305 2>&1 | xxd | head -5 || true
