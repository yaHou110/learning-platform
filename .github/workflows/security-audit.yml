name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
  schedule:
    # Weekly scan on Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for SARIF upload
  actions: read

jobs:
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OSV Scanner
        id: osv
        uses: google/osv-scanner@v1
        with:
          args: scan --lockfile=pnpm-lock.yaml --format=sarif --output=osv-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner