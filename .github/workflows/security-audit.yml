name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
  schedule:
    # Weekly scan on Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for SARIF upload
  actions: read

jobs:
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version` here: package.json `packageManager: pnpm@9.15.9` is the
        # source of truth. Setting `version: 9` here collided with it and failed
        # pnpm/action-setup@v4 ("Multiple versions of pnpm specified"). Match the
        # pattern used in governance.yml (action-setup with no `with:` block).
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OSV Scanner
        id: osv
        uses: google/osv-scanner@v1
        with:
          args: scan --lockfile=pnpm-lock.yaml --format=sarif --output=osv-results.sarif

      - name: Upload SARIF to GitHub Security
        # Best-effort upload. GitHub requires "Code scanning" enabled in repo
        # settings (Settings → Security → Code scanning) to accept SARIF; until a
        # repo admin enables it this step 401s, which would otherwise fail the
        # whole job even though the OSV scan itself succeeded. The scan output is
        # still printed to the run log; making the upload non-fatal keeps the
        # authoritative result (the scan) as the job's pass/fail signal.
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner